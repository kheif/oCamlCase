    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "oCamlCase",
      "url": "https://ocamlcase.dev",
      "description": "Learn OCaml by example. Build mental models for the type system, recursion, closures, and evaluation.",
      "inLanguage": "en"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "Learn OCaml by Example",
      "description": "A practical guide to OCaml covering 27 concepts from let bindings to modules, dune, and testing, with interactive labs and coding exercises.",
      "provider": {
        "@type": "Organization",
        "name": "oCamlCase",
        "url": "https://ocamlcase.dev"
      },
      "educationalLevel": "Intermediate",
      "programmingLanguage": "OCaml",
      "teaches": [
        "Bindings", "Currying", "Abstractions", "Lexical Scope", "Closures",
        "Type Inference", "Polymorphism", "Pattern Matching", "Lists",
        "List Operations", "Higher-Order Functions", "Tail Recursion",
        "Iteration", "Derived Forms", "Sorting", "Constructors and Exceptions",
        "Options and Result", "Records", "Trees", "Mutability"
      ],
      "hasPart": [
        {
          "@type": "CreativeWork",
          "name": "Coding Challenges",
          "description": "6 full-length OCaml exercises with playground integration",
          "url": "https://ocamlcase.dev/exercises"
        },
        {
          "@type": "CreativeWork",
          "name": "Mini Exercises",
          "description": "33 drag-and-drop exercises covering the core concepts",
          "url": "https://ocamlcase.dev/exercises/mini"
        },
        {
          "@type": "CreativeWork",
          "name": "Interpreter Pipeline",
          "description": "4-stage interactive interpreter: lexing, parsing, dynamics, recursion",
          "url": "https://ocamlcase.dev/interpreter/lexing"
        }
      ],
      "isAccessibleForFree": true
    }
    </script>
    <script>
      // Apply stored/system theme before first paint to avoid flash
      (function () {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.pgTheme = t;
      })();
    </script>
    <script>
      // GitHub Pages SPA fallback: 404.html redirects unknown paths to /?p=...
      // Restore the real path before React mounts so React Router sees it.
      (function () {
        var u = new URL(window.location.href);
        var p = u.searchParams.get('p');
        if (p) {
          u.searchParams.delete('p');
          var search = u.searchParams.toString();
          var newUrl = p + (search ? '?' + search : '') + u.hash;
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
